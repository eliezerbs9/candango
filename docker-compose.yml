# Local development infrastructure for Candango (host-agnostic — not production).
# Usage: `docker compose up -d`  (requires Docker). No-Docker alternative: install
# PostgreSQL 16 + Redis via Homebrew and point DATABASE_URL/REDIS_URL at them.

services:
  postgres:
    image: postgres:16
    container_name: candango-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: candango
    ports:
      - '5432:5432'
    volumes:
      - candango_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: candango-redis
    ports:
      - '6379:6379'

  # E-signature engine (self-hosted DocuSeal CE). Run JUST this service (Postgres/Redis here are
  # optional — many devs run those natively via Homebrew): `docker compose up -d docuseal`.
  # Then open http://localhost:3030: create the first user, copy the API token (Settings → API)
  # into apps/api/.env as DOCUSEAL_API_KEY, and add a webhook (Settings → Webhooks) pointing at
  #   http://host.docker.internal:4000/v1/public/docuseal/webhook
  # Uses its own bundled SQLite (persisted in the volume) — no dependency on the Postgres above,
  # so it won't clash with a native Postgres on 5432.
  docuseal:
    image: docuseal/docuseal:latest
    container_name: candango-docuseal
    ports:
      - '3030:3000'
    environment:
      HOST: localhost:3030
    volumes:
      - candango_docuseal:/data

volumes:
  candango_pgdata:
  candango_docuseal:

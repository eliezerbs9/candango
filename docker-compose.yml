# Local development infrastructure for Candango (host-agnostic — not production).
# Usage: `docker compose up -d`  (requires Docker). No-Docker alternative: install
# PostgreSQL 16 + Redis via Homebrew and point DATABASE_URL/REDIS_URL at them.

services:
  postgres:
    image: postgres:16
    container_name: candango-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: candango
    ports:
      - '5432:5432'
    volumes:
      - candango_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: candango-redis
    ports:
      - '6379:6379'

  # E-signature engine (self-hosted DocuSeal CE). After `docker compose up -d`, open
  # http://localhost:3030: create the first user, copy the API token (Settings → API) into
  # apps/api/.env as DOCUSEAL_API_KEY, and add a webhook (Settings → Webhooks) pointing at
  #   http://host.docker.internal:4000/v1/public/docuseal/webhook
  docuseal:
    image: docuseal/docuseal:latest
    container_name: candango-docuseal
    ports:
      - '3030:3000'
    environment:
      HOST: localhost:3030
      # Uses the bundled SQLite by default (persisted in the volume). To use Postgres instead:
      # DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docuseal
    volumes:
      - candango_docuseal:/data
    depends_on:
      - postgres

volumes:
  candango_pgdata:
  candango_docuseal:
